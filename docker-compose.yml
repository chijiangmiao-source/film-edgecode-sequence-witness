services:
  api:
    build: .
    image: edgecode-assembly-api
    ports:
      # Host port is overridable: API_PORT=9000 docker compose up api
      - "${API_PORT:-8000}:8000"
    environment:
      # Ingestion tasks/chunks live in embedded SQLite; the named volume
      # keeps them across container restarts and recreations.
      EDGECODE_DB_PATH: /data/edgecode_ingest.db
    volumes:
      - edgecode-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  verify:
    build: .
    image: edgecode-assembly-api
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
    # One-shot acceptance: unit/integration tests, then live HTTP checks.
    command: ["sh", "-c", "python -m pytest tests -q && python scripts/acceptance.py"]
    restart: "no"

volumes:
  edgecode-data:
